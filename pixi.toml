[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["https://prefix.dev/almost-conductor", "conda-forge"]
name = "sclens"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
instantiate = "julia --project=. -e 'using Pkg; Pkg.instantiate()'"
export-env = "pixi workspace export conda-environment --name sclens envs/sclens.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/sclens.yml"

# scLENS and CUDA.jl come from Project.toml/Manifest.toml (Pkg), not conda;
# CUDA.jl fetches its own runtime artifacts on first use.
[dependencies]
julia = ">=1.11,<1.13"
denet = "==0.10.3"
